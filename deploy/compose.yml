# Production-shaped stack (D-122): PostgreSQL, MinIO evidence store, API and web. Secrets come from deploy/.env
# (copy .env.example; never commit real values). First create the roles with scripts/db-setup.sh (PG_SUPERUSER_URL
# pointing at this postgres); the `migrate` service then applies migrations as the owner on every start.
#   docker compose -f deploy/compose.yml --env-file deploy/.env up -d
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}' }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ['CMD', 'pg_isready', '-U', 'postgres'], interval: 5s, retries: 10 }
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data
    environment:
      MINIO_ROOT_USER: '${EVIDENCE_S3_ACCESS_KEY_ID:?set EVIDENCE_S3_ACCESS_KEY_ID}'
      MINIO_ROOT_PASSWORD: '${EVIDENCE_S3_SECRET_ACCESS_KEY:?set EVIDENCE_S3_SECRET_ACCESS_KEY}'
    volumes: [minio:/data]
  migrate:
    build: { context: .., dockerfile: deploy/Dockerfile, target: api }
    env_file: .env
    command: ['pnpm', '--filter', '@tigeris/api', 'db:migrate']
    depends_on: { postgres: { condition: service_healthy } }
  api:
    build: { context: .., dockerfile: deploy/Dockerfile, target: api }
    env_file: .env
    environment: { EVIDENCE_S3_ENDPOINT: 'http://minio:9000' }
    depends_on: { migrate: { condition: service_completed_successfully }, minio: { condition: service_started } }
  web:
    build: { context: .., dockerfile: deploy/Dockerfile, target: web }
    ports: ['8080:8080']
    depends_on: [api]
volumes: { pgdata: {}, minio: {} }
