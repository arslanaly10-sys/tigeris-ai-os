server {
  listen 8080;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header X-Frame-Options DENY always;
  # Same-origin only: fonts are self-hosted and the app calls only its own API (security review, D-125).
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  client_max_body_size 26m;
  location /api/ { proxy_pass http://api:4000; proxy_set_header Host $host; }
  # Single-page app: unknown paths serve the shell.
  location / { try_files $uri /index.html; }
}
