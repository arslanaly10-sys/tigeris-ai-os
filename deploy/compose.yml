# Production-shaped stack (D-122): PostgreSQL, API and web. Evidence goes to the S3-compatible store named by
# EVIDENCE_S3_ENDPOINT in .env (the institution's MinIO or S3), or to the `uploads` volume when it is empty. Secrets come from deploy/.env
# (copy .env.example; never commit real values). On every start `db-setup` creates the roles and database if missing
# (never drops anything) and `migrate` applies new migrations as the owner.
#   docker compose -f deploy/compose.yml --env-file deploy/.env up -d
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}' }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ['CMD', 'pg_isready', '-U', 'postgres'], interval: 5s, retries: 10 }
  db-setup:
    image: postgres:16
    env_file: .env
    volumes: ['../scripts:/scripts:ro']
    environment:
      TIGERIS_DB_KEEP: '1'
      PG_SUPERUSER_URL: 'postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432'
    command: ['bash', '/scripts/db-setup.sh']
    depends_on: { postgres: { condition: service_healthy } }
  migrate:
    build: { context: .., dockerfile: deploy/Dockerfile, target: api }
    env_file: .env
    command: ['node_modules/.bin/tsx', 'src/db/migrate.ts']
    depends_on: { db-setup: { condition: service_completed_successfully } }
  api:
    build: { context: .., dockerfile: deploy/Dockerfile, target: api }
    env_file: .env
    environment: { UPLOAD_DIR: /var/tigeris/uploads }
    volumes: ['uploads:/var/tigeris/uploads']
    depends_on: { migrate: { condition: service_completed_successfully } }
  web:
    build: { context: .., dockerfile: deploy/Dockerfile, target: web }
    ports: ['8080:8080']
    depends_on: [api]
volumes: { pgdata: {}, uploads: {} }
